# MacBookPro16,1: Intel drives the panel; AMD remains available for rendering.
# Keep DPM enabled with fixed clocks (udev rule), and avoid runtime GPU power-off.
# Exclude phantom outputs before the desktop starts; use a text disk-unlock prompt.
KERNEL_CMDLINE[default]+=" apple_gmux.force_igd=1 amdgpu.dpm=1 amdgpu.runpm=0 video=eDP-2:d video=Unknown-1:d plymouth.enable=0"
